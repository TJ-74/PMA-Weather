name: Deploy to AWS Lambda

on:
  push:
    branches:
      - main
      - TJ  # adding your current branch

env:
  AWS_REGION: us-east-1  # Change this to your desired region
  FUNCTION_NAME: pma-weather

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Build application
        run: pnpm run build
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEXT_PUBLIC_OPENWEATHER_API_KEY: ${{ secrets.NEXT_PUBLIC_OPENWEATHER_API_KEY }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}

      - name: Package application
        run: |
          cd .next/standalone
          zip -r ../../lambda-deployment.zip .
          cd ../..

      - name: Deploy to Lambda
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: |
          # Check if function exists
          if aws lambda get-function --function-name ${{ env.FUNCTION_NAME }} &> /dev/null; then
            echo "Updating existing Lambda function..."
            aws lambda update-function-code \
              --function-name ${{ env.FUNCTION_NAME }} \
              --zip-file fileb://lambda-deployment.zip
          else
            echo "Creating new Lambda function..."
            aws lambda create-function \
              --function-name ${{ env.FUNCTION_NAME }} \
              --runtime nodejs18.x \
              --handler server.handler \
              --role ${{ secrets.LAMBDA_EXECUTION_ROLE }} \
              --zip-file fileb://lambda-deployment.zip \
              --timeout 30 \
              --memory-size 1024 \
              --environment '{
                "GROQ_API_KEY": "'${{ secrets.GROQ_API_KEY }}'",
                "NEXT_PUBLIC_OPENWEATHER_API_KEY": "'${{ secrets.NEXT_PUBLIC_OPENWEATHER_API_KEY }}'",
                "NEXT_PUBLIC_FIREBASE_API_KEY": "'${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}'",
                "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN": "'${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}'",
                "NEXT_PUBLIC_FIREBASE_PROJECT_ID": "'${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}'",
                "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET": "'${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}'",
                "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID": "'${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}'",
                "NEXT_PUBLIC_FIREBASE_APP_ID": "'${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}'"
              }'

          fi
